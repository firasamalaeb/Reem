<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Be My Valentine</title>

<style>
  body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    background: radial-gradient(circle at top, #ffd6e0, #ff9a9e);
    font-family: 'Arial', sans-serif;
  }

  .card {
    background: rgba(255, 255, 255, 0.85);
    padding: 55px 60px;
    border-radius: 30px;
    text-align: center;
    box-shadow:
      0 30px 60px rgba(230, 57, 70, 0.25),
      inset 0 0 30px rgba(255, 255, 255, 0.6);
    backdrop-filter: blur(10px);
    position: relative;
    z-index: 10;
    animation: fadeIn 1.2s ease;
  }

  @keyframes fadeIn {
    from {
      transform: translateY(20px);
      opacity: 0;
    }
    to {
      transform: translateY(0);
      opacity: 1;
    }
  }

  h1 {
    color: #b5172b;
    margin-bottom: 35px;
    line-height: 1.4;
    font-weight: bold;
  }

  button {
    padding: 16px 36px;
    font-size: 18px;
    border-radius: 50px;
    border: none;
    cursor: pointer;
    margin: 10px 15px;
    transition: all 0.3s ease;
  }

  #yes {
    background: linear-gradient(135deg, #e63946, #ff758f);
    color: white;
    box-shadow: 0 10px 25px rgba(230, 57, 70, 0.5);
  }

  #yes:hover {
    transform: scale(1.12);
  }

  #no {
    background: rgba(255,255,255,0.8);
    color: #555;
    position: absolute;
    box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    transition: all 0.3s ease;
  }

  /* Floating hearts */
  .heart {
    position: absolute;
    bottom: -20px;
    font-size: 26px;
    animation: floatUp 7s linear infinite;
    opacity: 0.6;
    z-index: 1;
  }

  @keyframes floatUp {
    0% {
      transform: translateY(0) scale(1);
      opacity: 0.6;
    }
    100% {
      transform: translateY(-120vh) scale(1.6);
      opacity: 0;
    }
  }
</style>
</head>

<body>

<div class="card">
  <h1>Reem Wajdi Al Ahmadieh,<br>will you marry me? 💕</h1>
  <button id="yes" onclick="yesClick()">YES 💖</button>
  <button id="no" onmouseover="moveNo()">NO 🙈</button>
</div>

<script>
  const corners = [
    { x: "10px", y: "10px" },                           // top-left
    { x: "calc(100% - 110px)", y: "10px" },             // top-right
    { x: "10px", y: "calc(100% - 60px)" },              // bottom-left
    { x: "calc(100% - 110px)", y: "calc(100% - 60px)" } // bottom-right
  ];

  let index = 0;

  function moveNo() {
    const noBtn = document.getElementById("no");
    index = (index + 1) % corners.length;
    noBtn.style.left = corners[index].x;
    noBtn.style.top = corners[index].y;
  }

  function yesClick() {
    window.location.href = "div.html";
  }

  // floating hearts
  setInterval(() => {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "❤️";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDuration = (Math.random() * 3 + 3) + "s";
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 6000);
  }, 300);
</script>  

 
</body>
</html>
